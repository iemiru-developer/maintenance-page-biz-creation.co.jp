  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: #333;
      background: #fff;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 400;
      font-size: 16px;
      line-height: 2;
      letter-spacing: 0.1em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 18vh 8vw 8vh 13vw;
    }

    .logo {
      display: block;
      width: min(311px, 62vw);
      height: auto;
      margin-bottom: 42px;
    }

    .label {
      display: block;
      margin-bottom: 12px;
      color: #00983c;
      font-family: "Jost", sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.12em;
      line-height: 1;
    }

    h1 {
      max-width: 14em;
      color: #3e3e3e;
      font-size: clamp(32px, 3.6vw, 52px);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0.04em;
    }

    .lead {
      max-width: 28em;
      margin-top: 28px;
      font-size: 16px;
      font-weight: 400;
      line-height: 2;
      letter-spacing: 0.1em;
    }

    .copyright {
      margin-top: 64px;
      color: #767676;
      font-family: "Jost", sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    @media (max-width: 768px) {
      .page {
        justify-content: flex-start;
        padding: 108px 28px 48px;
      }

      .logo {
        width: 227px;
        margin-bottom: 36px;
      }

      h1 {
        font-size: 30px;
      }

      .lead {
        margin-top: 20px;
        font-size: 14px;
        line-height: 1.9;
        letter-spacing: 0.02em;
      }

      .copyright {
        margin-top: 48px;
      }
    }
  </style>
